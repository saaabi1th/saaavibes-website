<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080914">
<title>SAAAVIBES — Digital, reimagined</title>
<style>
:root {
  --site-primary: #7657F6;
  --site-secondary: #19C8D8;
  --site-background: #080914;
  --site-on-primary: #FFFFFF;
  --site-on-secondary: #061217;
  --site-on-background: #F5F5FF;
  --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-font-heading: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
  color-scheme: dark light;
}
* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; background: var(--site-background); color: var(--site-on-background); font-family: var(--site-font-body); }
#app {
  min-height: 100vh;
  width: 100%;
  border-radius: 0;
  overflow: hidden;
  position: relative;
  isolation: isolate;
  background-color: var(--site-background);
  color: var(--site-on-background);
}
#app:before, #app:after {
  content: ""; position: fixed; z-index: -1; pointer-events: none; opacity: var(--site-decoration-opacity);
  filter: blur(75px); border-radius: 50%;
}
#app:before { width: 42vw; height: 42vw; min-width: 320px; min-height: 320px; top: -18vw; left: -12vw; background: color-mix(in srgb, var(--site-primary) 28%, transparent); }
#app:after { width: 48vw; height: 48vw; min-width: 340px; min-height: 340px; right: -20vw; bottom: -22vw; background: color-mix(in srgb, var(--site-secondary) 20%, transparent); }
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
.topbar { position: absolute; z-index: 20; top: 22px; right: 24px; display:flex; align-items:center; gap:12px; }
.menu-wrap { position:relative; }
.glass {
  background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 18px 60px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
}
.icon-btn { width:48px; height:48px; display:grid; place-items:center; border-radius:17px; color:#fff; cursor:pointer; transition:.25s ease; }
.icon-btn:hover { transform:translateY(-2px); border-color:rgba(25,200,216,.6); box-shadow:0 0 28px rgba(25,200,216,.15); }
.dots { display:flex; gap:4px; }
.dots i { width:4px; height:4px; background:#fff; border-radius:50%; display:block; }
.menu-panel { position:absolute; right:0; top:60px; width:220px; padding:9px; border-radius:20px; display:none; animation:pop .2s ease; }
.menu-panel.open { display:block; }
.menu-panel a { display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:13px; color:#e7e8f5; font-size:14px; transition:.2s; }
.menu-panel a:hover { background:rgba(118,87,246,.18); color:#fff; }
.menu-panel .mi { width:22px; color:#7ee9ec; text-align:center; }
.page { min-height:100vh; position:relative; display:flex; align-items:center; justify-content:center; padding:100px 24px 64px; }
.home { padding-top:72px; }
.home-inner { width:min(100%, 900px); text-align:center; margin:auto; }
.brand-mark { display:inline-flex; align-items:center; gap:10px; margin-bottom:27px; opacity:.9; }
.brand-mark span { width:7px; height:7px; border-radius:50%; background:#6ff2dc; box-shadow:0 0 18px #6ff2dc; }
.wordmark { margin:0; font-family:var(--site-font-heading); font-size:clamp(3.25rem, 10.5vw, 8.8rem); line-height:.95; letter-spacing:-.085em; font-weight:850; background:linear-gradient(105deg,#fff 5%,#c6bcff 44%,#80f1ee 90%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 10px 55px rgba(118,87,246,.13); }
.home-sub { margin:25px 0 0; color:rgba(230,232,255,.54); letter-spacing:.28em; text-transform:uppercase; font-size:clamp(9px,1.6vw,12px); }
.socials { display:flex; justify-content:center; gap:13px; margin-top:52px; }
.social { width:49px; height:49px; display:grid; place-items:center; border-radius:17px; color:#f3f3ff; transition:.25s ease; }
.social:hover { transform:translateY(-5px); color:#7ff2e5; border-color:rgba(25,200,216,.55); }
.social svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7; }
.footer-note { position:absolute; bottom:25px; left:0; right:0; text-align:center; color:rgba(220,222,245,.28); font-size:11px; letter-spacing:.12em; }
.ai-tab { position:fixed; z-index:30; right:0; top:50%; transform:translateY(-50%); writing-mode:vertical-rl; padding:17px 11px; border-radius:16px 0 0 16px; color:#fff; cursor:pointer; letter-spacing:.12em; font-size:11px; font-weight:700; border-right:0; background:linear-gradient(180deg,rgba(118,87,246,.55),rgba(25,200,216,.24)); box-shadow:0 0 35px rgba(118,87,246,.18); }
.ai-tab:hover { padding-right:16px; }
.ai-panel { position:fixed; z-index:40; right:20px; bottom:20px; width:min(370px,calc(100vw - 40px)); height:min(490px,calc(100vh - 40px)); border-radius:25px; display:none; overflow:hidden; }
.ai-panel.open { display:flex; flex-direction:column; animation:rise .25s ease; }
.ai-head { display:flex; align-items:center; justify-content:space-between; padding:17px 18px; border-bottom:1px solid rgba(255,255,255,.1); }
.ai-head strong { font-size:14px; letter-spacing:.04em; }
.ai-body { flex:1; overflow:auto; padding:18px; color:#d9d9ec; font-size:13px; line-height:1.65; }
.ai-msg { padding:12px 13px; border-radius:14px; background:rgba(255,255,255,.07); margin-bottom:12px; }
.ai-quick { display:flex; flex-wrap:wrap; gap:7px; }
.ai-quick button { border:1px solid rgba(255,255,255,.15); border-radius:30px; padding:8px 11px; color:#d9fafa; background:rgba(25,200,216,.08); cursor:pointer; font-size:11px; }
.ai-input { padding:12px; border-top:1px solid rgba(255,255,255,.1); display:flex; gap:8px; }
.ai-input input { min-width:0; flex:1; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:12px; color:white; padding:11px; outline:none; }
.ai-input button, .primary-btn { border:0; border-radius:12px; padding:11px 15px; color:#fff; font-weight:700; background:linear-gradient(110deg,var(--site-primary),#397bdc); cursor:pointer; }
.content-page { width:min(100%,980px); margin:auto; }
.backlink { display:inline-flex; align-items:center; gap:8px; color:#aeb1cb; font-size:13px; margin-bottom:28px; }
.eyebrow { color:#7ee9e4; text-transform:uppercase; letter-spacing:.22em; font-size:11px; font-weight:700; }
h1 { font-family:var(--site-font-heading); font-size:calc(clamp(2.5rem,7vw,5rem) * var(--site-heading-scale)); letter-spacing:-.06em; line-height:1; margin:14px 0 18px; }
.lead { color:#b9bad0; font-size:16px; line-height:1.8; max-width:650px; }
.about-grid { display:grid; grid-template-columns: minmax(230px,.8fr) 1.2fr; gap:clamp(25px,5vw,60px); align-items:center; }
.profile-photo { width:100%; max-height:600px; object-fit:cover; object-position:center 35%; border-radius:28px; border:1px solid rgba(255,255,255,.18); box-shadow:0 25px 80px rgba(0,0,0,.35); }
.info-card { padding:clamp(22px,4vw,36px); border-radius:26px; }
.info-card h2 { font-size:25px; margin:0 0 10px; letter-spacing:-.04em; }
.info-card p { color:#b9bad0; line-height:1.8; }
.tag-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
.tag { border:1px solid rgba(126,233,228,.22); color:#baf8ef; background:rgba(25,200,216,.07); border-radius:30px; padding:9px 12px; font-size:11px; }
.stack { display:grid; gap:13px; margin-top:30px; }
.faq-item { padding:20px 22px; border-radius:18px; }
.faq-item h3 { margin:0 0 8px; font-size:16px; }
.faq-item p { color:#b9bad0; margin:0; line-height:1.7; font-size:14px; }
.contact-card { max-width:650px; padding:clamp(25px,5vw,42px); border-radius:26px; margin-top:30px; }
.contact-link { display:inline-flex; align-items:center; gap:10px; margin-top:18px; padding:14px 18px; border-radius:14px; background:rgba(118,87,246,.16); border:1px solid rgba(160,145,255,.25); color:#e6e1ff; }
.auth-wrap { width:min(100%,470px); margin:auto; }
.auth-card { padding:clamp(24px,5vw,38px); border-radius:27px; }
.auth-card h2 { margin:0 0 9px; font-size:26px; letter-spacing:-.04em; }
.auth-card .muted { color:#aeb0c8; font-size:13px; line-height:1.6; }
.tabs { display:flex; padding:4px; border-radius:13px; background:rgba(0,0,0,.22); margin:23px 0; }
.tabs button { flex:1; padding:10px; border:0; border-radius:10px; color:#aeb0c8; background:transparent; cursor:pointer; }
.tabs button.active { background:rgba(118,87,246,.28); color:white; }
.field { margin:14px 0; }
.field label { display:block; font-size:12px; color:#c7c8dc; margin-bottom:7px; }
.field input { width:100%; padding:13px 14px; border-radius:12px; color:#fff; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.13); outline:none; }
.field input:focus { border-color:#8b79ff; box-shadow:0 0 0 3px rgba(118,87,246,.12); }
.full { width:100%; margin-top:8px; }
.status { min-height:22px; color:#91eee0; font-size:12px; margin-top:12px; }
.account { display:none; }
.account.show { display:block; }
.hidden { display:none !important; }
.small-btn { border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07); color:#e9e9f5; border-radius:11px; padding:10px 13px; cursor:pointer; }
@keyframes pop { from { opacity:0; transform:translateY(-7px) scale(.98); } to {opacity:1;transform:none;} }
@keyframes rise { from {opacity:0;transform:translateY(12px);} to {opacity:1;transform:none;} }
@media(max-width:700px) {
  .topbar { top:15px; right:15px; }
  .page { padding:90px 20px 55px; }
  .home { padding-top:40px; }
  .home-sub { letter-spacing:.18em; }
  .socials { margin-top:40px; }
  .about-grid { grid-template-columns:1fr; max-width:520px; }
  .profile-photo { max-height:430px; object-position:center 30%; }
  .ai-panel { right:10px; bottom:10px; width:calc(100vw - 20px); height:min(500px,calc(100vh - 20px)); }
}
@media(prefers-reduced-motion:reduce) { *,*:before,*:after { scroll-behavior:auto !important; animation:none !important; transition:none !important; } }

.icon-btn{background:rgba(19,18,29,.86);border-radius:16px}.wordmark{background:linear-gradient(110deg,#fff 12%,#d9ccff 52%,#8beadd);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 12px 38px rgba(142,111,245,.14))}

@media(prefers-reduced-motion:reduce){.faq-item{transition:none}}
</style>

  faq: () => `<section class="page"><div class="content-page"><a class="backlink" href="#/">← Back to home</a><div class="eyebrow">Need to know</div><h1>Frequently asked<br>questions<span style="color:#7ee9e4">.</span></h1><p class="lead">Quick answers about the SAAAVIBES website and its features.</p><div class="stack"><article class="faq-item glass"><h3>What is SAAAVIBES?</h3><p>SAAAVIBES is a personal digital brand and website created as part of the SAAA vision.</p></article><article class="faq-item glass"><h3>How can I find the other pages?</h3><p>Use the three-dot menu in the top-right corner. About, FAQ, Contact, and Private Space are available there.</p></article><article class="faq-item glass"><h3>What is SAAA AI?</h3><p>SAAA AI is a small FAQ assistant that answers questions about this website and its features only.</p></article><article class="faq-item glass"><h3>What is Private Space?</h3><p>Private Space is a sign-in area. After signing in, you can manage your account display name.</p></article><article class="faq-item glass"><h3>How do I contact SAAAVIBES?</h3><p>Open Contact from the three-dot menu or use the email button on the Home page.</p></article></div></div></section>`,
  contact: () => `<section class="page"><div class="content-page"><a class="backlink" href="#/">← Back to home</a><div class="eyebrow">Get in touch</div><h1>Let's connect<span style="color:#7ee9e4">.</span></h1><p class="lead">For questions or messages about SAAAVIBES, reach out by email.</p><div class="contact-card glass"><div class="eyebrow">Email</div><h2 style="font-size:clamp(20px,4vw,30px);margin:12px 0;color:#fff">saaabi1th@outlook.com</h2><p style="color:#aeb0c8;line-height:1.7">Your message will open in your default email app.</p><a class="contact-link" href="mailto:saaabi1th@outlook.com">✉ &nbsp; Send an email</a></div></div></section>`,
  privatespace: () => `<section class="page"><div class="auth-wrap"><a class="backlink" href="#/">← Back to home</a><div class="auth-card glass" id="authCard"><div class="eyebrow">SAAAVIBES / PRIVATE</div><h2>Private Space<span style="color:#7ee9e4">.</span></h2><p class="muted">A personal sign-in area. Create an account or log in to continue.</p><div id="authArea"><div class="tabs"><button id="loginTab" class="active" type="button">Log in</button><button id="signupTab" type="button">Sign up</button></div><form id="authForm"><div class="field hidden" id="nameField"><label for="displayName">Display name</label><input id="displayName" autocomplete="name" maxlength="40" placeholder="Your display name"></div><div class="field"><label for="authEmail">Email address</label><input id="authEmail" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></div><button class="primary-btn full" id="authSubmit">Log in</button></form><div class="status" id="authStatus" role="status"></div></div><div class="account" id="accountArea"><p class="muted">You are signed in.</p><div class="field"><label for="savedName">Display name</label><input id="savedName" maxlength="40" placeholder="Your display name"></div><button class="primary-btn full" id="saveName">Save display name</button><button class="small-btn full" id="logout" style="margin-top:12px">Log out</button><div class="status" id="accountStatus"></div></div></div><p class="muted" style="font-size:11px;text-align:center;margin:15px 12px">Your account is managed securely through Supabase authentication.</p></div></section>`
};
function render() {
  const route = (location.hash.replace(/^#\/?/, '').split('?')[0] || 'home').toLowerCase();
  view.innerHTML = (pages[route] || pages.home)();
  menuPanel.classList.remove('open');
  if (route === 'privatespace') initAuth();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);
render();

const aiPanel = document.getElementById('aiPanel');
const aiToggle = document.getElementById('aiToggle');
function toggleAI(open) { aiPanel.classList.toggle('open',open); aiToggle.setAttribute('aria-expanded',String(open)); }
aiToggle.addEventListener('click',()=>toggleAI(!aiPanel.classList.contains('open')));
document.getElementById('aiClose').addEventListener('click',()=>toggleAI(false));
const faqAnswers = [
  {keys:['what is saaavibes','saaavibes'],answer:'SAAAVIBES is a personal digital brand and website created as part of the SAAA vision.'},
  {keys:['about','founder','who'],answer:'Open the three-dot menu in the top-right corner and choose About to read the founder profile.'},
  {keys:['faq','question'],answer:'The FAQ page contains answers about the website, SAAA AI, Private Space, and contact details.'},
  {keys:['private space','login','sign up','account'],answer:'Choose Private Space from the three-dot menu. You can sign up or log in, then manage your display name.'},
  {keys:['contact','email','mail'],answer:'You can email SAAAVIBES at saaabi1th@outlook.com from the Contact page.'},
  {keys:['ai','assistant'],answer:'SAAA AI is this small FAQ helper. It only answers questions about SAAAVIBES and this website.'},
  {keys:['menu','three dot','3 dot'],answer:'Tap the three-dot button at the top-right. The other pages are listed there.'}
];
function askAI(q) {
  const body=document.getElementById('aiBody');
  const norm=q.toLowerCase();
  const hit=faqAnswers.find(item=>item.keys.some(k=>norm.includes(k)));
  const answer=hit?hit.answer:"I can only help with SAAAVIBES website FAQs. Try asking about About, FAQ, Contact, Private Space, or the menu.";
  body.insertAdjacentHTML('beforeend',`<div class="ai-msg" style="margin-left:35px;background:rgba(118,87,246,.16)"></div><div class="ai-msg"></div>`);
  const msgs=body.querySelectorAll('.ai-msg'); msgs[msgs.length-2].textContent=q; msgs[msgs.length-1].textContent=answer;
  body.scrollTop=body.scrollHeight;
}
document.getElementById('aiForm').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('aiQuestion');if(input.value.trim()){askAI(input.value.trim());input.value='';}});
document.querySelectorAll('.ai-quick button').forEach(b=>b.addEventListener('click',()=>askAI(b.dataset.q)));

let supabaseClient = null;
let authInitPromise = null;
async function getSupabase() {
  if (supabaseClient) return supabaseClient;
  if (!authInitPromise) authInitPromise = (async()=>{
    try {
      const mod = await import('https://esm.sh/@supabase/supabase-js@2');
      supabaseClient = mod.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
      return supabaseClient;
    } catch(err) { return null; }
  })();
  return authInitPromise;
}
let authMode='login';
function setAuthMode(mode) {
  authMode=mode;
  const login=document.getElementById('loginTab'), signup=document.getElementById('signupTab');
  if(!login||!signup)return;
  login.classList.toggle('active',mode==='login'); signup.classList.toggle('active',mode==='signup');
  document.getElementById('nameField').classList.toggle('hidden',mode!=='signup');
  document.getElementById('authSubmit').textContent=mode==='login'?'Log in':'Create account';
}
async function initAuth() {
  const loginTab=document.getElementById('loginTab');
  if(!loginTab)return;
  loginTab.addEventListener('click',()=>setAuthMode('login'));
  document.getElementById('signupTab').addEventListener('click',()=>setAuthMode('signup'));
  const sb=await getSupabase();
  const status=document.getElementById('authStatus');
  if(!sb) { status.textContent='Live sign-in requires an internet connection. This local preview still shows the Private Space design.'; return; }
  const {data:{session}}=await sb.auth.getSession();
  showAccount(session?.user||null);
  sb.auth.onAuthStateChange((_event,newSession)=>showAccount(newSession?.user||null));
  document.getElementById('authForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const email=document.getElementById('authEmail').value.trim();
    const password=document.getElementById('authPassword').value;
    status.textContent='Please wait…';
    let result;
    if(authMode==='signup') {
      const displayName=document.getElementById('displayName').value.trim();
      if(!displayName){status.textContent='Please enter a display name.';return;}
      result=await sb.auth.signUp({email,password,options:{data:{full_name:displayName}}});
      if(!result.error&&!result.data.session) status.textContent='Check your email for the confirmation link.';
    } else result=await sb.auth.signInWithPassword({email,password});
    if(result.error) status.textContent=result.error.message;
    else if(authMode==='login') status.textContent='Signed in successfully.';
  });
  document.getElementById('saveName').addEventListener('click',async()=>{
    const name=document.getElementById('savedName').value.trim();
    const out=document.getElementById('accountStatus');
    if(!name){out.textContent='Enter a display name first.';return;}
    const {error}=await sb.auth.updateUser({data:{full_name:name}});
    out.textContent=error?error.message:'Display name updated.';
  });
  document.getElementById('logout').addEventListener('click',async()=>{
    const {error}=await sb.auth.signOut();
    document.getElementById('accountStatus').textContent=error?error.message:'You have been logged out.';
  });
}
function showAccount(user) {
  const auth=document.getElementById('authArea'), account=document.getElementById('accountArea');
  if(!auth||!account)return;
  auth.classList.toggle('hidden',!!user); account.classList.toggle('show',!!user);
  if(user) document.getElementById('savedName').value=user.user_metadata?.full_name||'';
}
</script>
</body>
</html>
