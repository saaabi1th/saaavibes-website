<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private — SAAAVIBES</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="top"><div class="shell nav"><a class="brand" href="index.html">SAAA<span>VIBES</span></a><a class="btn" href="dashboard.html">Dashboard</a></div></header><main class="shell section"><div class="eyebrow">Personal workspace</div><h1>Your private <span class="gradient">corner.</span></h1><div class="toolgrid"><section class="card"><h3>Quick Notes</h3><textarea class="field" id="notes" placeholder="Write an idea or reminder"></textarea><button class="btn primary" id="save">Save on this device</button><p id="saved" class="notice"></p></section><section class="card"><h3>Personal checklist</h3><input class="field" id="task" placeholder="Add a task"><button class="btn" id="add">Add task</button><ul id="tasks"></ul></section></div><p class="muted">Starter version stores notes/tasks in this browser only. Cloud sync will be added later.</p></main><script src="assets/js/config.js"></script><script type="module">const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");const sb=createClient(SAAAVIBES_CONFIG.supabaseUrl,SAAAVIBES_CONFIG.supabasePublishableKey);const {data:{session}}=await sb.auth.getSession();if(!session)location.href="login.html";else{const k="saaavibes-"+session.user.id;let d=JSON.parse(localStorage.getItem(k)||'{}'),tasks=d.tasks||[];document.getElementById("notes").value=d.notes||"";const save=()=>localStorage.setItem(k,JSON.stringify({notes:document.getElementById("notes").value,tasks}));const render=()=>{const ul=document.getElementById("tasks");ul.innerHTML="";tasks.forEach((t,i)=>{const li=document.createElement("li");li.textContent=t+" ";const b=document.createElement("button");b.textContent="×";b.onclick=()=>{tasks.splice(i,1);save();render();};li.append(b);ul.append(li);});};document.getElementById("save").onclick=()=>{save();document.getElementById("saved").textContent="Saved on this device.";};document.getElementById("add").onclick=()=>{let v=document.getElementById("task").value.trim();if(v){tasks.push(v);document.getElementById("task").value="";save();render();}};render();}</script></body></html>
