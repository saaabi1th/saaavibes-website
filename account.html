<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — SAAAVIBES</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="top"><div class="shell nav"><a class="brand" href="index.html">SAAA<span>VIBES</span></a><a class="btn" href="dashboard.html">Dashboard</a></div></header><main class="shell center"><section class="auth glass"><div class="eyebrow">Account settings</div><h1>Your <span class="gradient">account.</span></h1><p id="emailLabel" class="muted"></p><form id="profile" class="form"><input class="field" id="displayName" placeholder="Display name"><button class="btn primary">Save profile</button></form><form id="passwordForm" class="form section"><input class="field" id="newPassword" type="password" minlength="6" placeholder="New password"><button class="btn">Update password</button></form><div id="notice" class="notice"></div><button class="btn" id="logout">Sign out</button></section></main><script src="assets/js/config.js"></script><script type="module">const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");const sb=createClient(SAAAVIBES_CONFIG.supabaseUrl,SAAAVIBES_CONFIG.supabasePublishableKey);const {data:{session}}=await sb.auth.getSession();if(!session)location.href="login.html";else{document.getElementById("emailLabel").textContent=session.user.email;document.getElementById("displayName").value=session.user.user_metadata?.full_name||"";}const n=document.getElementById("notice");document.getElementById("profile").onsubmit=async e=>{e.preventDefault();const r=await sb.auth.updateUser({data:{full_name:document.getElementById("displayName").value.trim()}});n.textContent=r.error?.message||"Profile updated.";};document.getElementById("passwordForm").onsubmit=async e=>{e.preventDefault();const r=await sb.auth.updateUser({password:document.getElementById("newPassword").value});n.textContent=r.error?.message||"Password updated.";};document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.href="index.html";};</script></body></html>
