<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — SAAAVIBES</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="top"><div class="shell nav"><a class="brand" href="index.html">SAAA<span>VIBES</span></a><a class="btn" href="index.html">Home</a></div></header><main class="shell center"><section class="auth glass"><div class="eyebrow">Your personal space</div><h1 id="heading">Welcome <span class="gradient">back.</span></h1><p class="muted">Sign in to your own SAAAVIBES account.</p><div class="form"><input class="field" id="name" placeholder="Display name (for sign up)" hidden><input class="field" id="email" type="email" placeholder="Email address"><input class="field" id="password" type="password" minlength="6" placeholder="Password (6+ characters)"><button class="btn primary" id="submit">Login</button><button class="btn" id="switch">Create account</button><button class="btn" id="forgot">Forgot password?</button><div class="notice" id="notice"></div></div></section></main>
<script src="assets/js/config.js"></script><script type="module">
const $=id=>document.getElementById(id);const {createClient}=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");const sb=createClient(SAAAVIBES_CONFIG.supabaseUrl,SAAAVIBES_CONFIG.supabasePublishableKey);let mode="login";const msg=t=>$("notice").textContent=t;
$("switch").onclick=()=>{mode=mode==="login"?"signup":"login";$("name").hidden=mode!=="signup";$("submit").textContent=mode==="signup"?"Create account":"Login";$("heading").textContent=mode==="signup"?"Create your space.":"Welcome back.";msg("");};
$("submit").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return msg("Enter email and password.");msg("Please wait…");let r;if(mode==="signup"){r=await sb.auth.signUp({email,password,options:{data:{full_name:$("name").value.trim()}}});if(!r.error)msg("Account created. Check your email to verify, then login.");}else{r=await sb.auth.signInWithPassword({email,password});if(!r.error)location.href="dashboard.html";}if(r?.error)msg(r.error.message);};
$("forgot").onclick=async()=>{const email=$("email").value.trim();if(!email)return msg("Enter your email first.");const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/account.html"});msg(r.error?.message||"If registered, a reset link will be sent.");};
</script></body></html>
